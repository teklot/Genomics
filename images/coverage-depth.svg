<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="1" dy="1" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Standard Markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#3b82f6"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#22c55e"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#dc2626"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#94a3b8"/>
    </marker>
  </defs>
  <title>Coverage Depth Visualization</title>

  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Coverage Depth — Reads Stacking on Reference</text>

  <!-- Reference genome line -->
  <path d="M50,120 L550,120" stroke="#3b82f6" stroke-width="4"/>
  <text x="50" y="135" font-size="11" fill="#2563eb">Reference</text>

  <!-- Individual reads stacked above (left region: high coverage) -->
  <rect filter="url(#shadow)" x="80" y="40" width="120" height="10" rx="3" fill="#22c55e" opacity="0.7"/>
  <rect filter="url(#shadow)" x="140" y="30" width="120" height="10" rx="3" fill="#22c55e" opacity="0.7"/>
  <rect filter="url(#shadow)" x="100" y="55" width="130" height="10" rx="3" fill="#22c55e" opacity="0.7"/>
  <rect filter="url(#shadow)" x="60" y="20" width="140" height="10" rx="3" fill="#22c55e" opacity="0.7"/>
  <rect filter="url(#shadow)" x="170" y="45" width="130" height="10" rx="3" fill="#22c55e" opacity="0.7"/>
  <rect filter="url(#shadow)" x="120" y="65" width="120" height="10" rx="3" fill="#22c55e" opacity="0.7"/>
  <rect filter="url(#shadow)" x="200" y="35" width="120" height="10" rx="3" fill="#22c55e" opacity="0.7"/>
  <rect filter="url(#shadow)" x="160" y="70" width="130" height="10" rx="3" fill="#22c55e" opacity="0.7"/>
  <rect filter="url(#shadow)" x="90" y="75" width="120" height="10" rx="3" fill="#22c55e" opacity="0.7"/>

  <!-- Second region (medium coverage) -->
  <rect filter="url(#shadow)" x="340" y="40" width="100" height="10" rx="3" fill="#22c55e" opacity="0.7"/>
  <rect filter="url(#shadow)" x="360" y="55" width="110" height="10" rx="3" fill="#22c55e" opacity="0.7"/>
  <rect filter="url(#shadow)" x="350" y="30" width="120" height="10" rx="3" fill="#22c55e" opacity="0.7"/>
  <rect filter="url(#shadow)" x="370" y="65" width="100" height="10" rx="3" fill="#22c55e" opacity="0.7"/>

  <!-- Third region (low coverage) -->
  <rect filter="url(#shadow)" x="480" y="55" width="60" height="10" rx="3" fill="#f59e0b" opacity="0.7"/>
  <rect filter="url(#shadow)" x="490" y="70" width="50" height="10" rx="3" fill="#f59e0b" opacity="0.7"/>

  <!-- Coverage annotation brackets -->
  <path d="M150,95 L150,135" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2,2"/>
  <path d="M390,95 L390,135" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2,2"/>
  <path d="M510,95 L510,135" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2,2"/>

  <!-- Coverage values -->
  <text x="150" y="155" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">9× depth</text>
  <text x="390" y="155" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">4× depth</text>
  <text x="510" y="155" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">2× depth</text>

  <!-- Mean coverage bar -->
  <rect x="50" y="185" width="500" height="30" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="300" y="205" text-anchor="middle" font-size="12" fill="#475569">Mean coverage = 5× (each base read ~5 times on average)</text>

  <!-- Why coverage matters -->
  <rect filter="url(#shadow)" x="50" y="230" width="500" height="50" rx="6" fill="#fefce8" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="300" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="#c2410c">Why Coverage Matters</text>
  <text x="300" y="268" text-anchor="middle" font-size="11" fill="#475569">Higher coverage = more confidence in base calls and variant detection</text>
</svg>