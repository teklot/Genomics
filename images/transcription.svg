<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 380" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13">
  <title>Transcription: DNA to RNA</title>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1" />
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6" />
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626" />
    </marker>
    <marker id="arrowGrey" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="325" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Transcription: DNA → RNA</text>

  <!-- DNA top strand (coding) -->
  <text x="50" y="55" font-size="13" font-weight="bold" fill="#1d4ed8">DNA Coding Strand:</text>
  <path d="M50,70 C100,70 550,70 600,70" stroke="#3b82f6" stroke-width="3" fill="none"/>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="50" y="85" font-size="11" fill="#2563eb">5'</text>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="600" y="85" font-size="11" fill="#2563eb">3'</text>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="80" y="65" text-anchor="start" font-size="14" font-weight="bold" fill="#1e293b">A T G C A C T G A T C G</text>
 
  <!-- DNA bottom strand (template) -->
  <text x="50" y="100" font-size="13" font-weight="bold" fill="#1d4ed8">DNA Template Strand:</text>
  <path d="M50,115 C100,115 550,115 600,115" stroke="#3b82f6" stroke-width="3" fill="none"/>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="50" y="130" font-size="11" fill="#2563eb">3'</text>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="600" y="130" font-size="11" fill="#2563eb">5'</text>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="80" y="110" text-anchor="start" font-size="14" font-weight="bold" fill="#1e293b">T A C G T G A C T A G C</text>

  <!-- RNA Polymerase shape -->
  <ellipse filter="url(#shadow)" cx="280" cy="92" rx="55" ry="25" fill="#fce7f3" stroke="#ec4899" stroke-width="2.5"/>
  <text x="280" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#be185d">RNA Pol II</text>
  <text x="280" y="102" text-anchor="middle" font-size="10" fill="#be185d">5'→3'</text>

  <!-- Direction arrow -->
  <path d="M305,92 C330,92 355,92 380,92" stroke="#be185d" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>

  <!-- RNA strand being synthesized -->
  <text x="50" y="170" font-size="13" font-weight="bold" fill="#b45309">RNA Being Synthesized:</text>
  <path d="M380,180 C400,180 580,180 600,180" stroke="#f59e0b" stroke-width="3" fill="none"/>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="490" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">A U G C A C U G A U C G</text>
  <text x="490" y="210" text-anchor="middle" font-size="10" fill="#64748b">(U replaces T)</text>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="600" y="175" font-size="11" fill="#b45309">5'</text>

  <!-- Unwinding zone label -->
  <ellipse cx="250" cy="145" rx="70" ry="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="250" y="149" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">Unwinding zone</text>

  <!-- SWE analogy box -->
  <rect filter="url(#shadow)" x="420" y="230" width="180" height="70" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="510" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">SWE Analogy</text>
  <text x="510" y="272" text-anchor="middle" font-size="11" fill="#475569">Source File →</text>
  <text x="510" y="288" text-anchor="middle" font-size="11" fill="#475569">Intermediate Build Artifact</text>

  <!-- Base pairing details -->
  <g transform="translate(70, 230)">
    <rect filter="url(#shadow)" x="0" y="0" width="320" height="110" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="160" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">Base Pairing in Transcription:</text>
    <text font-family="Consolas, 'Liberation Mono', monospace" x="50" y="50" font-size="12" fill="#1e293b">DNA A <tspan font-family="Inter, system-ui, -apple-system, sans-serif">⇔</tspan> U RNA</text>
    <text font-family="Consolas, 'Liberation Mono', monospace" x="170" y="50" font-size="12" fill="#1e293b">DNA T <tspan font-family="Inter, system-ui, -apple-system, sans-serif">⇔</tspan> A RNA</text>
    <text font-family="Consolas, 'Liberation Mono', monospace" x="50" y="72" font-size="12" fill="#1e293b">DNA G <tspan font-family="Inter, system-ui, -apple-system, sans-serif">⇔</tspan> C RNA</text>
    <text font-family="Consolas, 'Liberation Mono', monospace" x="170" y="72" font-size="12" fill="#1e293b">DNA C <tspan font-family="Inter, system-ui, -apple-system, sans-serif">⇔</tspan> G RNA</text>
    <text x="160" y="96" text-anchor="middle" font-size="11" fill="#64748b">mRNA is complementary to the template strand</text>
  </g>
</svg>