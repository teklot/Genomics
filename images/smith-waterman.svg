    <text font-family="Consolas, 'Liberation Mono', monospace" x="150" y="15" text-anchor="middle" font-weight="bold" fill="#1e293b">G</text>
    <text font-family="Consolas, 'Liberation Mono', monospace" x="180" y="15" text-anchor="middle" font-weight="bold" fill="#1e293b">A</text>
