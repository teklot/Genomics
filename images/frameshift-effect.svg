<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 500" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="1" dy="1" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Standard Markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#3b82f6"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#22c55e"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#dc2626"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#94a3b8"/>
    </marker>
  </defs>
  <title>Frameshift Effect: Reading Frame Disruption</title>

  <!-- Title -->
  <text x="325" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Frameshift Effect: Reading Frame Disruption</text>

  <!-- Normal reading frame -->
  <g transform="translate(0, 20)">
    <text x="50" y="45" font-size="13" font-weight="bold" fill="#15803d">Normal (in frame):</text>
    <rect filter="url(#shadow)" x="50" y="55" width="540" height="60" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>

    <g transform="translate(70, 70)">
      <rect filter="url(#shadow)" x="0" y="0" width="60" height="30" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1" />
      <text font-family="Consolas, monospace" x="30" y="20" text-anchor="middle" font-size="12" fill="#166534">ATG</text>
      <text x="30" y="-8" text-anchor="middle" font-size="10" font-weight="bold" fill="#22c55e">Met</text>
    </g>

    <g transform="translate(150, 70)">
      <rect filter="url(#shadow)" x="0" y="0" width="60" height="30" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1" />
      <text font-family="Consolas, monospace" x="30" y="20" text-anchor="middle" font-size="12" fill="#166534">GCT</text>
      <text x="30" y="-8" text-anchor="middle" font-size="10" font-weight="bold" fill="#22c55e">Ala</text>
    </g>

    <g transform="translate(230, 70)">
      <rect filter="url(#shadow)" x="0" y="0" width="60" height="30" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1" />
      <text font-family="Consolas, monospace" x="30" y="20" text-anchor="middle" font-size="12" fill="#166534">TAC</text>
      <text x="30" y="-8" text-anchor="middle" font-size="10" font-weight="bold" fill="#22c55e">Tyr</text>
    </g>

    <g transform="translate(310, 70)">
      <rect filter="url(#shadow)" x="0" y="0" width="60" height="30" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1" />
      <text font-family="Consolas, monospace" x="30" y="20" text-anchor="middle" font-size="12" fill="#166534">TGA</text>
      <text x="30" y="-8" text-anchor="middle" font-size="10" font-weight="bold" fill="#22c55e">Stop</text>
    </g>

    <!-- Deletion Marker -->
    <text font-family="Consolas, monospace" x="155" y="45" text-anchor="middle" font-size="14" fill="#dc2626" font-weight="bold" text-decoration="line-through">G</text>
    <path d="M155,50 L155,65" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)" fill="none"/>
  </g>

  <!-- Frameshift (deletion) -->
  <g transform="translate(0, 150)">
    <text x="50" y="45" font-size="13" font-weight="bold" fill="#dc2626">Frameshift (−1 bp deletion):</text>
    <rect filter="url(#shadow)" x="50" y="55" width="540" height="60" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>

    <g transform="translate(70, 70)">
      <rect filter="url(#shadow)" x="0" y="0" width="60" height="30" rx="4" fill="#fecaca" stroke="#fca5a5" stroke-width="1"/>
      <text font-family="Consolas, monospace" x="30" y="20" text-anchor="middle" font-size="12" fill="#991b1b">ATG</text>
      <text x="30" y="-8" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc2626">Met</text>
    </g>

    <g transform="translate(150, 70)">
      <rect filter="url(#shadow)" x="0" y="0" width="60" height="30" rx="4" fill="#fecaca" stroke="#fca5a5" stroke-width="1"/>
      <text font-family="Consolas, monospace" x="30" y="20" text-anchor="middle" font-size="12" fill="#991b1b">CTA</text>
      <text x="30" y="-8" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc2626">Leu</text>
    </g>

    <g transform="translate(230, 70)">
      <rect filter="url(#shadow)" x="0" y="0" width="60" height="30" rx="4" fill="#fecaca" stroke="#fca5a5" stroke-width="1"/>
      <text font-family="Consolas, monospace" x="30" y="20" text-anchor="middle" font-size="12" fill="#991b1b">CTG</text>
      <text x="30" y="-8" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc2626">Leu</text>
    </g>

    <g transform="translate(310, 70)">
      <rect filter="url(#shadow)" x="0" y="0" width="60" height="30" rx="4" fill="#fecaca" stroke="#fca5a5" stroke-width="1"/>
      <text font-family="Consolas, monospace" x="30" y="20" text-anchor="middle" font-size="12" fill="#991b1b">AT...</text>
      <text x="30" y="-8" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc2626">???</text>
    </g>
    
    <text x="210" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">Everything shifted left by 1 position</text>
  </g>

  <!-- Explanation -->
  <rect filter="url(#shadow)" x="50" y="310" width="540" height="70" rx="10" fill="#fff7ed" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="320" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">Why Frameshifts Are Severe</text>
  <text x="320" y="355" text-anchor="middle" font-size="11" fill="#475569">Codons are read in groups of 3. Deleting 1 base changes every subsequent codon,</text>
  <text x="320" y="370" text-anchor="middle" font-size="11" fill="#475569">usually resulting in a completely different protein or a premature Stop codon.</text>

  <!-- Impact Comparison -->
  <g transform="translate(0, 400)">
    <rect filter="url(#shadow)" x="50" y="10" width="260" height="65" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="180" y="35" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">Missense (Point Mutation)</text>
    <text x="180" y="55" text-anchor="middle" font-size="11" fill="#475569">Only 1 amino acid changes</text>

    <rect filter="url(#shadow)" x="330" y="10" width="260" height="65" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="460" y="35" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">Frameshift (Indel)</text>
    <text x="460" y="55" text-anchor="middle" font-size="11" fill="#475569">All subsequent amino acids change</text>
  </g>
</svg>