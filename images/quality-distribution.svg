<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="1" dy="1" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Standard Markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#3b82f6"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#22c55e"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#dc2626"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#94a3b8"/>
    </marker>
  </defs>
  <title>Per-Base Quality Distribution (Good vs Bad)</title>

  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Per-Base Quality — Good Lane vs Bad Lane</text>

  <!-- Good lane -->
  <text x="70" y="55" font-size="13" font-weight="bold" fill="#15803d">Good:</text>

  <rect filter="url(#shadow)" x="55" y="65" width="230" height="120" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="170" y="83" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Q40</text>
  <rect filter="url(#shadow)" x="70" y="88" width="200" height="12" rx="3" fill="#22c55e"/>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="170" y="105" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Q30</text>
  <rect filter="url(#shadow)" x="70" y="112" width="200" height="12" rx="3" fill="#22c55e"/>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="170" y="125" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Q20</text>
  <rect filter="url(#shadow)" x="70" y="136" width="200" height="12" rx="3" fill="#86efac"/>
  <text x="170" y="152" text-anchor="middle" font-size="9" fill="#166534">→ all bases in green zone</text>

  <!-- Bad lane -->
  <text x="335" y="55" font-size="13" font-weight="bold" fill="#dc2626">Bad:</text>

  <rect filter="url(#shadow)" x="320" y="65" width="230" height="120" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="435" y="83" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Q40</text>
  <rect filter="url(#shadow)" x="335" y="88" width="80" height="12" rx="3" fill="#22c55e"/>
  <rect filter="url(#shadow)" x="415" y="88" width="60" height="12" rx="3" fill="#f59e0b"/>
  <rect filter="url(#shadow)" x="475" y="88" width="60" height="12" rx="3" fill="#ef4444"/>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="435" y="105" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Q30</text>
  <rect filter="url(#shadow)" x="335" y="112" width="70" height="12" rx="3" fill="#22c55e"/>
  <rect filter="url(#shadow)" x="405" y="112" width="60" height="12" rx="3" fill="#f59e0b"/>
  <rect filter="url(#shadow)" x="465" y="112" width="70" height="12" rx="3" fill="#ef4444"/>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="435" y="129" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">Q20</text>
  <rect filter="url(#shadow)" x="335" y="136" width="40" height="12" rx="3" fill="#86efac"/>
  <rect filter="url(#shadow)" x="375" y="136" width="60" height="12" rx="3" fill="#f59e0b"/>
  <rect filter="url(#shadow)" x="435" y="136" width="100" height="12" rx="3" fill="#ef4444"/>
  <text x="435" y="152" text-anchor="middle" font-size="9" fill="#991b1b">→ quality drops sharply</text>

  <!-- Read position labels -->
  <text x="170" y="198" text-anchor="middle" font-size="10" font-weight="bold" fill="#64748b">5'  →  3'</text>
  <text x="435" y="198" text-anchor="middle" font-size="10" font-weight="bold" fill="#64748b">5'  →  3'</text>

  <!-- Explanation box -->
  <rect filter="url(#shadow)" x="55" y="215" width="495" height="85" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="300" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Typical Illumina 2×150 Cycle</text>
  <text x="300" y="257" text-anchor="middle" font-size="11" fill="#475569">First ~5 bases: lower quality (template switching noise)</text>
  <text x="300" y="273" text-anchor="middle" font-size="11" fill="#475569">Middle bases: highest quality (Q35–Q40)</text>
  <text x="300" y="289" text-anchor="middle" font-size="11" fill="#475569">Last bases: quality degrades (phasing, dephasing effects)</text>
</svg>