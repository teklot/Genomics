<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13">
  <title>Nanopore Sequencing</title>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="1" dy="1" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Standard Markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#3b82f6"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#22c55e"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#dc2626"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Nanopore Sequencing Principle</text>

  <!-- Regions -->
  <!-- cis side (top) -->
  <rect filter="url(#shadow)" x="40" y="60" width="520" height="150" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="60" y="85" font-size="12" font-weight="bold" fill="#0369a1">cis side (Input DNA)</text>

  <!-- trans side (bottom) -->
  <rect filter="url(#shadow)" x="40" y="220" width="520" height="140" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="60" y="245" font-size="12" font-weight="bold" fill="#7e22ce">trans side (Output DNA)</text>

  <!-- Lipid Bilayer Membrane -->
  <rect x="40" y="205" width="520" height="20" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="300" y="219" text-anchor="middle" font-size="11" font-weight="bold" fill="#64748b">Lipid Bilayer Membrane</text>

  <!-- Nanopore Protein (Simplified) -->
  <g filter="url(#shadow)">
    <!-- Left side of pore -->
    <path d="M230,160 C230,160 210,160 210,215 L210,230 C210,270 230,270 230,270" fill="#fce7f3" stroke="#ec4899" stroke-width="3"/>
    <!-- Right side of pore -->
    <path d="M370,160 C370,160 390,160 390,215 L390,230 C390,270 370,270 370,270" fill="#fce7f3" stroke="#ec4899" stroke-width="3"/>
    <!-- The "funnel" and "barrel" -->
    <path d="M230,160 C250,150 350,150 370,160" fill="none" stroke="#ec4899" stroke-width="3"/>
    <path d="M230,270 C250,280 350,280 370,270" fill="none" stroke="#ec4899" stroke-width="3"/>
  </g>
  <text x="300" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#be185d">Biological Nanopore</text>

  <!-- DNA Strand passing through -->
  <path d="M80,100 C150,100 180,130 250,130 C280,130 300,160 300,215 L300,280 C300,320 250,330 200,340" fill="none" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>

  <!-- Bases labels perfectly aligned to path -->
  <g font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#1e293b">
    <text x="210" y="125">A</text>
    <text x="245" y="125">T</text>
    <text x="278" y="150">G</text>
    <text x="288" y="180">C</text>
    <text x="305" y="210">A</text>
    <text x="305" y="240">T</text>
    <text x="290" y="275">G</text>
  </g>

  <!-- Ion Flow (Current) -->
  <path d="M315,180 L315,250" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2" fill="none" marker-end="url(#arrowGrey)"/>
  <text x="325" y="219" font-size="10" fill="#64748b" font-style="italic">Ionic Current</text>

  <!-- Signal Box (Repositioned to avoid overlap) -->
  <g transform="translate(420, 80)">
    <rect filter="url(#shadow)" x="0" y="0" width="150" height="120" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="75" y="22" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">Current Signal (pA)</text>
    
    <!-- Squiggly signal -->
    <path d="M10,60 C20,60 25,50 30,55 C35,60 40,75 50,75 C60,75 65,55 70,60 C75,65 80,45 90,45 C100,45 105,70 110,65 C115,60 120,55 130,55 C135,55 140,65 145,65" fill="none" stroke="#22c55e" stroke-width="2"/>
    
    <text x="75" y="95" text-anchor="middle" font-size="10" fill="#64748b">Unique disruption</text>
    <text x="75" y="108" text-anchor="middle" font-size="10" fill="#64748b">for each base</text>
  </g>

  <!-- Base Calling flow -->
  <path d="M495,200 C495,220 495,230 495,250" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrowGrey)"/>

  <rect filter="url(#shadow)" x="420" y="250" width="150" height="45" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="495" y="272" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">Neural Network</text>
  <text x="495" y="286" text-anchor="middle" font-size="10" fill="#64748b">Base Caller (Dorado)</text>

  <!-- Key features -->
  <rect x="40" y="375" width="520" height="85" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="55" y="398" font-size="12" font-weight="bold" fill="#1e293b">Key Features:</text>
  <text x="55" y="416" font-size="11" fill="#475569">• Real-time sequencing of native DNA/RNA molecules</text>
  <text x="55" y="432" font-size="11" fill="#475569">• No theoretical limit on read length (Ultra-long reads)</text>
  <text x="55" y="448" font-size="11" fill="#475569">• Portable: MinION device is the size of a stapler</text>
</svg>