<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 400" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13">
  <title>Translation: Ribosome and tRNA</title>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1" />
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6" />
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626" />
    </marker>
    <marker id="arrowGrey" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="325" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Translation — Ribosome in Action</text>

  <!-- Ribosome large subunit -->
  <ellipse cx="300" cy="200" rx="130" ry="70" fill="#e0e7ff" stroke="#6366f1" stroke-width="3"/>
  <text x="300" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#4338ca">Ribosome (Large)</text>

  <!-- Ribosome small subunit -->
  <ellipse cx="300" cy="260" rx="130" ry="40" fill="#c7d2fe" stroke="#6366f1" stroke-width="3"/>
  <text x="300" y="290" text-anchor="middle" font-size="14" font-weight="bold" fill="#4338ca">Ribosome (Small)</text>

  <!-- A, P, E sites -->
  <rect filter="url(#shadow)" x="190" y="160" width="45" height="30" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="212" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">E</text>
  <text x="212" y="148" text-anchor="middle" font-size="10" font-weight="bold" fill="#f59e0b">Exit</text>

  <rect filter="url(#shadow)" x="260" y="160" width="45" height="30" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="282" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">P</text>
  <text x="282" y="148" text-anchor="middle" font-size="10" font-weight="bold" fill="#f59e0b">Peptidyl</text>

  <rect filter="url(#shadow)" x="330" y="160" width="45" height="30" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="352" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">A</text>
  <text x="352" y="148" text-anchor="middle" font-size="10" font-weight="bold" fill="#f59e0b">Aminoacyl</text>

  <!-- mRNA strand -->
  <path d="M50,250 C100,250 550,250 600,250" stroke="#2563eb" stroke-width="4" fill="none"/>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="50" y="270" font-size="11" fill="#2563eb">5'</text>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="600" y="270" font-size="11" fill="#2563eb">3'</text>

  <!-- Codons on mRNA -->
  <text font-family="Consolas, 'Liberation Mono', monospace" x="140" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">AUG</text>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="230" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">GCU</text>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="320" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">UAC</text>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="410" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">UGA</text>

  <!-- Codon labels -->
  <text x="140" y="225" text-anchor="middle" font-size="10" font-weight="bold" fill="#64748b">Start</text>
  <text x="410" y="225" text-anchor="middle" font-size="10" font-weight="bold" fill="#ef4444">Stop</text>

  <!-- Growing peptide chain -->
  <path d="M282,155 C282,100 200,90 180,100" stroke="#22c55e" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/>
  <rect filter="url(#shadow)" x="130" y="90" width="105" height="20" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="182" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Met-Ala-Tyr...</text>

  <!-- tRNA in A site -->
  <path d="M352,200 L360,220 L344,220 Z" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="340" y="215" text-anchor="end" font-size="10" font-weight="bold" fill="#b45309">tRNA</text>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="340" y="228" text-anchor="end" font-size="10" fill="#b45309">(UAC)</text>

  <!-- Incoming amino acid -->
  <circle cx="395" cy="160" r="14" fill="#fefce8" stroke="#f59e0b" stroke-width="2"/>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="395" y="164" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">Tyr</text>

  <!-- Ribosome movement -->
  <path d="M160,310 C200,310 400,310 440,310" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrowGrey)"/>
  <text x="300" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#64748b">Ribosome movement (5' → 3')</text>

  <!-- Legend -->
  <rect filter="url(#shadow)" x="50" y="330" width="540" height="55" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="325" y="350" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">The 3-Stage Pipeline (CPU-in-Cell Analogy)</text>
  <text x="140" y="370" text-anchor="middle" font-size="10" fill="#475569">E site: tRNA exits (write-back)</text>
  <text x="325" y="370" text-anchor="middle" font-size="10" fill="#475569">P site: peptide held (execute)</text>
  <text x="510" y="370" text-anchor="middle" font-size="10" fill="#475569">A site: new tRNA binds (fetch)</text>
</svg>