<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 200" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13">
  <title>Paired-End Sequencing Layout</title>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="1" dy="1" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Standard Markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#3b82f6"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#22c55e"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#dc2626"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="275" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Paired-End Sequencing Layout</text>

  <!-- Fragment -->
  <rect filter="url(#shadow)" x="100" y="55" width="350" height="40" rx="8" fill="#f0f9ff" stroke="#3b82f6" stroke-width="2"/>

  <!-- Adapters -->
  <rect filter="url(#shadow)" x="60" y="55" width="40" height="40" rx="4" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
  <text x="80" y="78" text-anchor="middle" font-size="10" font-weight="bold" fill="#be185d">Adptr</text>
  <rect filter="url(#shadow)" x="450" y="55" width="40" height="40" rx="4" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
  <text x="470" y="78" text-anchor="middle" font-size="10" font-weight="bold" fill="#be185d">Adptr</text>

  <!-- Read 1 arrow (curved path) -->
  <path d="M100,75 C150,75 200,75 250,75" stroke="#22c55e" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="175" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">Read 1 (150 bp)</text>

  <!-- Read 2 arrow (curved path) -->
  <path d="M450,75 C400,75 350,75 300,75" stroke="#f59e0b" stroke-width="4" fill="none" marker-end="url(#arrowAmber)"/>
  <text x="375" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">Read 2 (150 bp)</text>

  <!-- Gap label (Inner Distance) -->
  <path d="M250,85 L250,105" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2" fill="none"/>
  <path d="M300,85 L300,105" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2" fill="none"/>
  <path d="M250,105 L300,105" stroke="#94a3b8" stroke-width="1" fill="none"/>
  <text x="275" y="100" text-anchor="middle" font-size="9" font-weight="bold" fill="#64748b">Gap (50 bp)</text>
  <text x="275" y="117" text-anchor="middle" font-size="8" fill="#94a3b8">Gap = Insert − (R1 + R2)</text>

  <!-- Insert size label (Spans the entire DNA fragment) -->
  <path d="M100,95 L100,140" stroke="#3b82f6" stroke-width="1.5" fill="none"/>
  <path d="M450,95 L450,140" stroke="#3b82f6" stroke-width="1.5" fill="none"/>
  <path d="M100,140 L450,140" stroke="#3b82f6" stroke-width="2" fill="none" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
  <text x="275" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">Insert Size (e.g., 350 bp)</text>
  <text x="275" y="174" text-anchor="middle" font-size="10" fill="#64748b">The entire DNA fragment cloned between adapters</text>
</svg>