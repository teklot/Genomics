<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="1" dy="1" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Standard Markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#3b82f6"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#22c55e"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#dc2626"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#94a3b8"/>
    </marker>
  </defs>
  <title>FastQC Good vs Bad Comparison</title>

  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">FastQC Per-Sequence Quality Scores</text>

  <!-- Good -->
  <g transform="translate(15, 45)">
    <rect filter="url(#shadow)" x="0" y="0" width="275" height="145" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="137" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">✓ Good Library</text>

    <!-- Histogram bars -->
    <rect filter="url(#shadow)" x="30" y="30" width="200" height="5" rx="2" fill="#22c55e" opacity="0.3"/>
    <rect filter="url(#shadow)" x="30" y="35" width="210" height="5" rx="2" fill="#22c55e" opacity="0.3"/>
    <rect filter="url(#shadow)" x="30" y="40" width="215" height="5" rx="2" fill="#22c55e" opacity="0.3"/>
    <rect filter="url(#shadow)" x="30" y="45" width="220" height="5" rx="2" fill="#22c55e" opacity="0.3"/>
    <rect filter="url(#shadow)" x="30" y="50" width="225" height="6" rx="2" fill="#22c55e" opacity="0.5"/>
    <rect filter="url(#shadow)" x="30" y="56" width="230" height="6" rx="2" fill="#22c55e" opacity="0.5"/>
    <rect filter="url(#shadow)" x="30" y="62" width="232" height="6" rx="2" fill="#22c55e" opacity="0.6"/>
    <rect filter="url(#shadow)" x="30" y="68" width="235" height="7" rx="2" fill="#22c55e" opacity="0.7"/>
    <rect filter="url(#shadow)" x="30" y="75" width="238" height="8" rx="2" fill="#22c55e" opacity="0.8"/>
    <rect filter="url(#shadow)" x="30" y="83" width="240" height="10" rx="2" fill="#22c55e" opacity="0.9"/>
    <rect filter="url(#shadow)" x="30" y="93" width="240" height="12" rx="2" fill="#22c55e"/>
    <rect filter="url(#shadow)" x="30" y="105" width="238" height="10" rx="2" fill="#22c55e" opacity="0.9"/>
    <rect filter="url(#shadow)" x="30" y="115" width="235" height="8" rx="2" fill="#22c55e" opacity="0.8"/>
    <rect filter="url(#shadow)" x="30" y="123" width="230" height="6" rx="2" fill="#22c55e" opacity="0.6"/>
    <rect filter="url(#shadow)" x="30" y="129" width="220" height="5" rx="2" fill="#22c55e" opacity="0.4"/>

    <!-- Peak label -->
    <text font-family="Consolas, 'Liberation Mono', monospace" x="137" y="140" text-anchor="middle" font-size="10" fill="#166534">Peak at Q38 — single sharp peak</text>
  </g>

  <!-- Bad -->
  <g transform="translate(310, 45)">
    <rect filter="url(#shadow)" x="0" y="0" width="275" height="145" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="137" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">✗ Bad Library</text>

    <!-- Bimodal histogram -->
    <rect filter="url(#shadow)" x="30" y="30" width="120" height="5" rx="2" fill="#f59e0b" opacity="0.3"/>
    <rect filter="url(#shadow)" x="30" y="35" width="100" height="5" rx="2" fill="#f59e0b" opacity="0.3"/>
    <rect filter="url(#shadow)" x="30" y="40" width="80" height="5" rx="2" fill="#f59e0b" opacity="0.3"/>
    <rect filter="url(#shadow)" x="30" y="45" width="60" height="5" rx="2" fill="#f59e0b" opacity="0.4"/>
    <rect filter="url(#shadow)" x="30" y="50" width="50" height="5" rx="2" fill="#f59e0b" opacity="0.4"/>
    <rect filter="url(#shadow)" x="30" y="55" width="60" height="5" rx="2" fill="#f59e0b" opacity="0.5"/>
    <rect filter="url(#shadow)" x="30" y="60" width="70" height="5" rx="2" fill="#f59e0b" opacity="0.5"/>
    <rect filter="url(#shadow)" x="30" y="65" width="60" height="5" rx="2" fill="#f59e0b" opacity="0.4"/>
    <rect filter="url(#shadow)" x="30" y="70" width="50" height="5" rx="2" fill="#f59e0b" opacity="0.3"/>
    <rect filter="url(#shadow)" x="30" y="75" width="40" height="5" rx="2" fill="#f59e0b" opacity="0.3"/>

    <!-- Second peak -->
    <rect filter="url(#shadow)" x="90" y="85" width="40" height="6" rx="2" fill="#ef4444" opacity="0.4"/>
    <rect filter="url(#shadow)" x="100" y="91" width="50" height="6" rx="2" fill="#ef4444" opacity="0.5"/>
    <rect filter="url(#shadow)" x="110" y="97" width="55" height="7" rx="2" fill="#ef4444" opacity="0.6"/>
    <rect filter="url(#shadow)" x="115" y="104" width="60" height="8" rx="2" fill="#ef4444" opacity="0.7"/>
    <rect filter="url(#shadow)" x="120" y="112" width="55" height="10" rx="2" fill="#ef4444" opacity="0.8"/>
    <rect filter="url(#shadow)" x="115" y="122" width="60" height="8" rx="2" fill="#ef4444" opacity="0.7"/>
    <rect filter="url(#shadow)" x="105" y="130" width="50" height="6" rx="2" fill="#ef4444" opacity="0.5"/>

    <text x="137" y="140" text-anchor="middle" font-size="10" fill="#991b1b">Two peaks = contamination!</text>
  </g>

  <!-- GC content comparison -->
  <text x="300" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">GC Content Distribution</text>

  <!-- Good GC -->
  <g transform="translate(15, 220)">
    <rect filter="url(#shadow)" x="0" y="0" width="275" height="120" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="137" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">✓ Normal GC Content</text>

    <path d="M60,105 L60,25" stroke="#22c55e" stroke-width="2"/>
    <path d="M80,105 L80,25" stroke="#22c55e" stroke-width="3"/>
    <path d="M100,105 L100,30" stroke="#22c55e" stroke-width="5"/>
    <path d="M120,105 L120,35" stroke="#22c55e" stroke-width="10"/>
    <path d="M140,105 L140,20" stroke="#22c55e" stroke-width="15"/>
    <path d="M160,105 L160,30" stroke="#22c55e" stroke-width="10"/>
    <path d="M180,105 L180,40" stroke="#22c55e" stroke-width="5"/>
    <path d="M200,105 L200,50" stroke="#22c55e" stroke-width="3"/>
    <path d="M220,105 L220,60" stroke="#22c55e" stroke-width="2"/>

    <text x="137" y="115" text-anchor="middle" font-size="10" fill="#166534">Single peak ~41% (human genome)</text>
  </g>

  <!-- Bad GC -->
  <g transform="translate(310, 220)">
    <rect filter="url(#shadow)" x="0" y="0" width="275" height="120" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="137" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">✗ Contamination</text>

    <path d="M40,105 L40,30" stroke="#22c55e" stroke-width="5"/>
    <path d="M50,105 L50,40" stroke="#22c55e" stroke-width="8"/>
    <path d="M65,105 L65,50" stroke="#22c55e" stroke-width="5"/>
    <path d="M80,105 L80,55" stroke="#22c55e" stroke-width="3"/>

    <path d="M160,105 L160,35" stroke="#ef4444" stroke-width="5"/>
    <path d="M170,105 L170,30" stroke="#ef4444" stroke-width="8"/>
    <path d="M185,105 L185,40" stroke="#ef4444" stroke-width="5"/>
    <path d="M200,105 L200,50" stroke="#ef4444" stroke-width="3"/>

    <text x="137" y="115" text-anchor="middle" font-size="10" fill="#991b1b">Two peaks = different species/source</text>
  </g>
</svg>