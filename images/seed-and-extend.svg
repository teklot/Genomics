<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13">
  <title>Seed-and-Extend Alignment Algorithm</title>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1" />
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6" />
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626" />
    </marker>
    <marker id="arrowGrey" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Seed-and-Extend Alignment</text>

  <!-- Read -->
  <rect filter="url(#shadow)" x="50" y="50" width="500" height="30" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="300" y="71" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">Read: <tspan font-family="Consolas, 'Liberation Mono', monospace">ACTGACTGACTGACTGACTGACTG</tspan></text>

  <!-- Step 1: Find Seeds -->
  <text x="50" y="115" font-size="14" font-weight="bold" fill="#1e293b">Step 1: Find Seeds (exact k-mer matches)</text>

  <!-- Seeds -->
  <rect filter="url(#shadow)" x="100" y="130" width="80" height="25" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="140" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">ACTG</text>

  <rect filter="url(#shadow)" x="200" y="130" width="80" height="25" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="240" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">GACT</text>

  <rect filter="url(#shadow)" x="300" y="130" width="80" height="25" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="340" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">ACTG</text>

  <text x="410" y="148" font-size="12" fill="#64748b">... more seeds</text>

  <!-- Reference genome -->
  <text x="50" y="185" font-size="14" font-weight="bold" fill="#1e293b">Reference: index seeded positions</text>

  <rect filter="url(#shadow)" x="50" y="195" width="500" height="30" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="300" y="215" text-anchor="middle" font-size="12" fill="#1e293b">...ACTGTACGTACTGACTGAGCTACTGACTG...</text>

  <!-- Matching seeds on reference -->
  <rect x="106" y="195" width="48" height="30" rx="3" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="3,2"/>
  <text x="130" y="238" text-anchor="middle" font-size="10" font-weight="bold" fill="#f59e0b">seed 1</text>

  <rect x="256" y="195" width="48" height="30" rx="3" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="3,2"/>
  <text x="280" y="238" text-anchor="middle" font-size="10" font-weight="bold" fill="#f59e0b">seed 2</text>

  <rect x="466" y="195" width="48" height="30" rx="3" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="3,2"/>
  <text x="490" y="238" text-anchor="middle" font-size="10" font-weight="bold" fill="#f59e0b">seed 3</text>

  <!-- Step 2: Extend -->
  <text x="50" y="270" font-size="14" font-weight="bold" fill="#1e293b">Step 2: Extend seeds → full alignment</text>

  <rect filter="url(#shadow)" x="50" y="282" width="500" height="30" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="70" y="302" font-size="12" font-weight="bold" fill="#dc2626">Seed 1: no extension (flanking bases don't match)</text>

  <rect filter="url(#shadow)" x="50" y="318" width="500" height="30" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="70" y="338" font-size="12" font-weight="bold" fill="#15803d">Seed 2: extended → full match, keep as best alignment</text>
</svg>