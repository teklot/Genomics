<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12">
  <title>VCF Format: Header and Records</title>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="1" dy="1" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Standard Markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#3b82f6"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#22c55e"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#dc2626"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">VCF Format — Variant Call Format</text>

  <!-- Header section -->
  <rect filter="url(#shadow)" x="20" y="55" width="680" height="90" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="35" y="78" font-size="13" font-weight="bold" fill="#475569">Header (meta-information lines):</text>
  <g font-family="Consolas, monospace" font-size="11" fill="#64748b">
    <text x="35" y="100">##fileformat=VCFv4.2</text>
    <text x="35" y="118">##INFO=&lt;ID=DP,Number=1,Type=Integer,Description="Total Depth"&gt;</text>
    <text x="35" y="136">##FORMAT=&lt;ID=GT,Number=1,Type=String,Description="Genotype"&gt;</text>
  </g>

  <!-- Column header row -->
  <g transform="translate(20, 165)">
    <rect filter="url(#shadow)" x="0" y="-5" width="680" height="30" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <g font-size="11" font-weight="bold" fill="#1d4ed8" text-anchor="middle">
      <text x="35" y="15">#CHROM</text>
      <text x="100" y="15">POS</text>
      <text x="160" y="15">ID</text>
      <text x="215" y="15">REF</text>
      <text x="270" y="15">ALT</text>
      <text x="330" y="15">QUAL</text>
      <text x="395" y="15">FILTER</text>
      <text x="465" y="15">INFO</text>
      <text x="545" y="15">FORMAT</text>
      <text x="635" y="15">SAMPLE</text>
    </g>
  </g>

  <!-- Data row -->
  <g transform="translate(20, 205)">
    <rect x="0" y="-5" width="680" height="30" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
    <g font-family="Consolas, monospace" font-size="11" fill="#1e293b" text-anchor="middle">
      <text x="35" y="15">chr1</text>
      <text x="100" y="15">10000</text>
      <text x="160" y="15" fill="#94a3b8">.</text>
      <text x="215" y="15">G</text>
      <text x="270" y="15" fill="#dc2626">A</text>
      <text x="330" y="15">100</text>
      <text x="395" y="15" fill="#22c55e">PASS</text>
      <text x="465" y="15">DP=50</text>
      <text x="545" y="15">GT:GQ</text>
      <text x="635" y="15">0/1:40</text>
    </g>
  </g>

  <!-- Column annotations (More spaced out) -->
  <g transform="translate(20, 255)">
    <g filter="url(#shadow)" text-anchor="middle">
      <rect x="0" y="0" width="65" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
      <text x="32" y="18" font-size="10" font-weight="bold" fill="#1d4ed8">CHROM</text>
      <text x="32" y="34" font-size="9" fill="#475569">Chr Name</text>

      <rect x="75" y="0" width="60" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
      <text x="105" y="18" font-size="10" font-weight="bold" fill="#1d4ed8">POS</text>
      <text x="105" y="34" font-size="9" fill="#475569">1-based</text>

      <rect x="145" y="0" width="60" height="45" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
      <text x="175" y="18" font-size="10" font-weight="bold" fill="#b45309">ID</text>
      <text x="175" y="34" font-size="9" fill="#475569">rsID / .</text>

      <rect x="215" y="0" width="60" height="45" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
      <text x="245" y="18" font-size="10" font-weight="bold" fill="#b45309">REF/ALT</text>
      <text x="245" y="34" font-size="9" fill="#475569">Alleles</text>

      <rect x="285" y="0" width="60" height="45" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
      <text x="315" y="18" font-size="10" font-weight="bold" fill="#15803d">QUAL</text>
      <text x="315" y="34" font-size="9" fill="#475569">Quality</text>

      <rect x="355" y="0" width="70" height="45" rx="6" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1"/>
      <text x="390" y="18" font-size="10" font-weight="bold" fill="#0369a1">FILTER</text>
      <text x="390" y="34" font-size="9" fill="#475569">PASS / ...</text>

      <rect x="435" y="0" width="80" height="45" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
      <text x="475" y="18" font-size="10" font-weight="bold" fill="#4338ca">INFO</text>
      <text x="475" y="34" font-size="9" fill="#475569">Meta-data</text>

      <rect x="525" y="0" width="155" height="45" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1"/>
      <text x="602" y="18" font-size="10" font-weight="bold" fill="#a16207">FORMAT &amp; SAMPLE</text>
      <text x="602" y="34" font-size="9" fill="#475569">Genotypes, depths, etc.</text>
    </g>
  </g>

  <!-- Genotype legend box -->
  <rect filter="url(#shadow)" x="20" y="325" width="680" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="360" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Genotype (GT) Value Legend</text>
  <g font-family="Consolas, monospace" font-size="12" fill="#475569">
    <text x="60" y="375">0/0 : Hom-Ref (matches reference)</text>
    <text x="380" y="375">0/1 : Heterozygous (one of each)</text>
    <text x="60" y="398">1/1 : Hom-Alt (purely variant)</text>
    <text x="380" y="398">./. : No call (low coverage/quality)</text>
  </g>
</svg>