<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 450" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="1" dy="1" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Standard Markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#3b82f6"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#22c55e"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#dc2626"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#94a3b8"/>
    </marker>
  </defs>
  <title>Mutation Types: SNV, Indel, Structural Variants</title>

  <!-- Title -->
  <text x="325" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Mutation Types by Scale</text>

  <!-- Reference genome (top) -->
  <rect filter="url(#shadow)" x="50" y="50" width="550" height="30" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="325" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">Reference: A T G C G A A C C G A T</text>

  <!-- 1. SNV -->
  <rect filter="url(#shadow)" x="50" y="100" width="550" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="65" y="125" font-size="13" font-weight="bold" fill="#475569">SNV (Single Nucleotide Variant):</text>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="325" y="125" text-anchor="middle" font-size="13" fill="#1e293b">A T G C G <tspan fill="#dc2626" font-weight="bold">T</tspan> A C C G A T</text>
  <rect filter="url(#shadow)" x="515" y="108" width="70" height="24" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="550" y="124" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc2626">A → T</text>

  <!-- 2. Insertion -->
  <rect filter="url(#shadow)" x="50" y="155" width="550" height="45" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="65" y="181" font-size="13" font-weight="bold" fill="#475569">Insertion:</text>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="325" y="181" text-anchor="middle" font-size="13" fill="#1e293b">A T G C G A <tspan fill="#22c55e" font-weight="bold">T T T T</tspan> A C C G A T</text>
  <rect filter="url(#shadow)" x="515" y="165" width="70" height="24" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="550" y="181" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">+4 bp</text>

  <!-- 3. Deletion -->
  <rect filter="url(#shadow)" x="50" y="215" width="550" height="45" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="65" y="241" font-size="13" font-weight="bold" fill="#475569">Deletion:</text>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="325" y="241" text-anchor="middle" font-size="13" fill="#1e293b">A T G C <tspan fill="#94a3b8" style="text-decoration: line-through">G A A</tspan> C C G A T</text>
  <rect filter="url(#shadow)" x="515" y="225" width="70" height="24" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="550" y="241" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc2626">−3 bp</text>

  <!-- 4. Structural Variants -->
  <text x="50" y="295" font-size="13" font-weight="bold" fill="#475569">Structural Variants (≥50 bp):</text>

  <!-- Deletion (SV) -->
  <rect filter="url(#shadow)" x="50" y="310" width="170" height="50" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="135" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">Deletion</text>
  <text x="135" y="348" text-anchor="middle" font-size="10" fill="#475569">50,000 bp lost</text>

  <!-- Duplication -->
  <rect filter="url(#shadow)" x="240" y="310" width="170" height="50" rx="6" fill="#fefce8" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="325" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">Duplication</text>
  <text x="325" y="348" text-anchor="middle" font-size="10" fill="#475569">Block repeated</text>

  <!-- Inversion -->
  <rect filter="url(#shadow)" x="430" y="310" width="170" height="50" rx="6" fill="#f0f9ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="515" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">Inversion</text>
  <text x="515" y="348" text-anchor="middle" font-size="10" fill="#475569">Flipped orientation</text>

  <!-- Translocation -->
  <rect filter="url(#shadow)" x="50" y="375" width="550" height="50" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="325" y="395" text-anchor="middle" font-size="12" font-weight="bold" fill="#7e22ce">Translocation</text>
  <text x="325" y="413" text-anchor="middle" font-size="11" fill="#475569">Segment moves between non-homologous chromosomes (e.g., chr1 and chr2 swap pieces)</text>

  <!-- Arrow connecting SV types -->
  <path d="M325,363 C325,368 325,370 325,375" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrowGrey)"/>
</svg>