<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 600" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12">
  <title>AWS Genomics Architecture</title>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="1" dy="1" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Color-specific markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#3b82f6"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#f59e0b"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#be185d"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#94a3b8"/>
    </marker>

    <linearGradient id="vpcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="375" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">AWS Genomics Architecture</text>

  <!-- Internet gateway -->
  <rect x="325" y="45" width="100" height="40" rx="6" fill="#f8fafc" stroke="#0ea5e9" stroke-width="2"/>
  <text x="375" y="64" text-anchor="middle" font-size="11" font-weight="bold" fill="#0369a1">Internet</text>
  <text x="375" y="77" text-anchor="middle" font-size="9" fill="#64748b">Gateway</text>

  <!-- VPC box -->
  <rect filter="url(#shadow)" x="25" y="95" width="700" height="500" rx="12" fill="url(#vpcGrad)" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="8,3"/>
  <text x="45" y="120" font-size="14" font-weight="bold" fill="#1d4ed8">Amazon VPC</text>

  <!-- Public subnet -->
  <rect filter="url(#shadow)" x="50" y="140" width="270" height="150" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="185" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">Public Subnet</text>

  <!-- NAT gateway -->
  <rect filter="url(#shadow)" x="80" y="175" width="100" height="35" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="130" y="195" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">NAT Gateway</text>

  <!-- Public load balancer -->
  <rect filter="url(#shadow)" x="190" y="175" width="110" height="35" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="245" y="195" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">ALB</text>

  <!-- Bastion host -->
  <rect filter="url(#shadow)" x="80" y="225" width="100" height="40" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="130" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#be185d">Bastion</text>
  <text x="130" y="258" text-anchor="middle" font-size="9" fill="#64748b">Host</text>

  <!-- Private subnet 1 -->
  <rect filter="url(#shadow)" x="350" y="140" width="170" height="150" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="435" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#7e22ce">Private Subnet 1</text>

  <!-- Batch compute -->
  <rect filter="url(#shadow)" x="370" y="175" width="130" height="45" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="435" y="193" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">AWS Batch</text>
  <text x="435" y="208" text-anchor="middle" font-size="10" fill="#475569">Compute Farm</text>

  <!-- ECS / EKS -->
  <rect filter="url(#shadow)" x="370" y="230" width="130" height="45" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="435" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">ECS / EKS</text>
  <text x="435" y="263" text-anchor="middle" font-size="10" fill="#475569">Container Orchestrator</text>

  <!-- Private subnet 2 -->
  <rect filter="url(#shadow)" x="540" y="140" width="170" height="150" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="625" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#7e22ce">Private Subnet 2</text>

  <!-- HealthOmics -->
  <rect filter="url(#shadow)" x="560" y="175" width="130" height="45" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="625" y="193" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">HealthOmics</text>
  <text x="625" y="208" text-anchor="middle" font-size="10" fill="#475569">(managed genomics)</text>

  <!-- RDS -->
  <rect filter="url(#shadow)" x="560" y="230" width="130" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="625" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">RDS / Aurora</text>
  <text x="625" y="263" text-anchor="middle" font-size="10" fill="#475569">Sample Metadata</text>

  <!-- S3 -->
  <rect filter="url(#shadow)" x="50" y="310" width="660" height="55" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="375" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#a16207">Amazon S3 (via VPC Endpoint — no internet egress)</text>
  <text x="375" y="352" text-anchor="middle" font-size="10" fill="#475569">FASTQ input bucket | Work directory | Output bucket (BAM, VCF, QC reports)</text>

  <!-- EFS -->
  <rect filter="url(#shadow)" x="50" y="385" width="300" height="50" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="200" y="407" text-anchor="middle" font-size="13" font-weight="bold" fill="#0369a1">Amazon EFS</text>
  <text x="200" y="423" text-anchor="middle" font-size="10" fill="#475569">Shared reference genomes (hg38, indexes)</text>

  <!-- ECR -->
  <rect filter="url(#shadow)" x="370" y="385" width="200" height="50" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
  <text x="470" y="407" text-anchor="middle" font-size="13" font-weight="bold" fill="#be185d">Amazon ECR</text>
  <text x="470" y="423" text-anchor="middle" font-size="10" fill="#475569">Container images (pipeline, web)</text>

  <!-- CloudWatch -->
  <rect x="590" y="385" width="120" height="50" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="650" y="407" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">CloudWatch</text>
  <text x="650" y="423" text-anchor="middle" font-size="10" fill="#475569">Logs + Metrics</text>

  <!-- Data flow arrows -->
  <!-- User Traffic Ingress -->
  <path d="M375,85 C375,130 245,130 245,175" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)" fill="none"/>
  <path d="M245,210 L245,220 C245,230 35,230 35,245 L35,497 L120,497" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowBlue)" fill="none"/>

  <!-- Admin/Bastion Access -->
  <path d="M325,65 C200,65 130,100 130,225" stroke="#be185d" stroke-width="1.5" marker-end="url(#arrowRed)" fill="none"/>

  <!-- Private Egress (NAT) -->
  <path d="M370,200 L180,200" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)" fill="none"/>
  <path d="M130,175 C130,130 325,130 325,85" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)" fill="none"/>

  <!-- Data & Storage Flows -->
  <path d="M435,275 L435,310" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)" fill="none"/>
  <path d="M470,385 L470,285" stroke="#be185d" stroke-width="2" marker-end="url(#arrowRed)" fill="none"/>
  <path d="M200,435 L200,460" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowBlue)" fill="none"/>

  <!-- Control Plane Flows -->
  <path d="M340,497 L715,497 L715,275 L690,275" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowGrey)" fill="none"/>
  <path d="M510,460 C510,340 435,340 435,220" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowGrey)" fill="none"/>
  <path d="M510,460 C510,340 625,340 625,220" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowGrey)" fill="none"/>

  <!-- Dashboard box -->
  <rect filter="url(#shadow)" x="120" y="460" width="220" height="75" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="230" y="485" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">ASP.NET Core</text>
  <text x="230" y="503" text-anchor="middle" font-size="11" fill="#475569">Web Dashboard</text>
  <text x="230" y="518" text-anchor="middle" font-size="10" fill="#64748b">(HTMX + Bootstrap)</text>

  <!-- Nextflow box -->
  <rect filter="url(#shadow)" x="400" y="460" width="220" height="75" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="510" y="485" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">Nextflow</text>
  <text x="510" y="503" text-anchor="middle" font-size="11" fill="#475569">Workflow Engine</text>
  <text x="510" y="518" text-anchor="middle" font-size="10" fill="#64748b">(Docker containers)</text>

  <line x1="340" y1="497" x2="400" y2="497" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>

</svg>