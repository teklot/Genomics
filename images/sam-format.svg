<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 420" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12">
  <title>SAM Format: 11 Required Columns</title>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1" />
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6" />
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626" />
    </marker>
    <marker id="arrowGrey" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="375" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">SAM Format — 11 Required Fields + Optional Tags</text>

  <!-- Field name row -->
  <g transform="translate(20, 50)">
    <text x="42" y="0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">QNAME</text>
    <text x="112" y="0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">FLAG</text>
    <text x="172" y="0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">RNAME</text>
    <text x="232" y="0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">POS</text>
    <text x="292" y="0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">MAPQ</text>
    <text x="360" y="0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">CIGAR</text>
    <text x="427" y="0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">RNEXT</text>
    <text x="487" y="0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">PNEXT</text>
    <text x="547" y="0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">TLEN</text>
    <text x="602" y="0" text-anchor="middle" font-size="11" fill="#1e293b">SEQ</text>
    <text x="652" y="0" text-anchor="middle" font-size="11" fill="#1e293b">QUAL</text>
    <text x="693" y="0" text-anchor="middle" font-size="11" fill="#1e293b">TAGs</text>
  </g>

  <!-- Value row 1 -->
  <g transform="translate(20, 65)">
    <rect x="5" y="-5" width="705" height="30" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text font-family="Consolas, 'Liberation Mono', monospace" x="42" y="15" text-anchor="middle" font-size="10" fill="#475569">READ01</text>
    <text font-family="Consolas, 'Liberation Mono', monospace" x="112" y="15" text-anchor="middle" font-size="10" fill="#475569">99</text>
    <text font-family="Consolas, 'Liberation Mono', monospace" x="172" y="15" text-anchor="middle" font-size="10" fill="#475569">chr1</text>
    <text font-family="Consolas, 'Liberation Mono', monospace" x="232" y="15" text-anchor="middle" font-size="10" fill="#475569">10000</text>
    <text font-family="Consolas, 'Liberation Mono', monospace" x="292" y="15" text-anchor="middle" font-size="10" fill="#475569">60</text>
    <text font-family="Consolas, 'Liberation Mono', monospace" x="360" y="15" text-anchor="middle" font-size="10" fill="#475569">150M</text>
    <text font-family="Consolas, 'Liberation Mono', monospace" x="427" y="15" text-anchor="middle" font-size="10" fill="#475569">=</text>
    <text font-family="Consolas, 'Liberation Mono', monospace" x="487" y="15" text-anchor="middle" font-size="10" fill="#475569">10200</text>
    <text font-family="Consolas, 'Liberation Mono', monospace" x="547" y="15" text-anchor="middle" font-size="10" fill="#475569">350</text>
    <text font-family="Consolas, 'Liberation Mono', monospace" x="602" y="15" text-anchor="middle" font-size="10" fill="#475569">ACTG...</text>
    <text font-family="Consolas, 'Liberation Mono', monospace" x="652" y="15" text-anchor="middle" font-size="10" fill="#475569">IIIII...</text>
    <text font-family="Consolas, 'Liberation Mono', monospace" x="693" y="15" text-anchor="middle" font-size="10" fill="#475569">NM:i:0</text>
  </g>

  <!-- Field descriptions -->
  <g transform="translate(20, 110)">
    <rect filter="url(#shadow)" x="5" y="0" width="75" height="45" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="42" y="16" text-anchor="middle" font-size="10" font-weight="bold" fill="#1d4ed8">QNAME</text>
    <text x="42" y="35" text-anchor="middle" font-size="9" fill="#475569">Read ID</text>

    <rect filter="url(#shadow)" x="85" y="0" width="55" height="45" rx="4" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
    <text x="112" y="16" text-anchor="middle" font-size="10" font-weight="bold" fill="#be185d">FLAG</text>
    <text x="112" y="35" text-anchor="middle" font-size="9" fill="#475569">Bitwise</text>

    <rect filter="url(#shadow)" x="145" y="0" width="55" height="45" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="172" y="16" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">RNAME</text>
    <text x="172" y="35" text-anchor="middle" font-size="9" fill="#475569">Ref Name</text>

    <rect filter="url(#shadow)" x="205" y="0" width="55" height="45" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="232" y="16" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">POS</text>
    <text x="232" y="35" text-anchor="middle" font-size="9" fill="#475569">1-based</text>

    <rect filter="url(#shadow)" x="265" y="0" width="55" height="45" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
    <text x="292" y="16" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">MAPQ</text>
    <text x="292" y="35" text-anchor="middle" font-size="9" fill="#475569">Quality</text>

    <rect filter="url(#shadow)" x="325" y="0" width="70" height="45" rx="4" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1"/>
    <text x="360" y="16" text-anchor="middle" font-size="10" font-weight="bold" fill="#0369a1">CIGAR</text>
    <text x="360" y="35" text-anchor="middle" font-size="9" fill="#475569">Alignment</text>

    <rect filter="url(#shadow)" x="400" y="0" width="55" height="45" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
    <text x="427" y="16" text-anchor="middle" font-size="10" font-weight="bold" fill="#4338ca">RNEXT</text>
    <text x="427" y="35" text-anchor="middle" font-size="9" fill="#475569">Mate Ref</text>

    <rect filter="url(#shadow)" x="460" y="0" width="55" height="45" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
    <text x="487" y="16" text-anchor="middle" font-size="10" font-weight="bold" fill="#4338ca">PNEXT</text>
    <text x="487" y="35" text-anchor="middle" font-size="9" fill="#475569">Mate Pos</text>

    <rect filter="url(#shadow)" x="520" y="0" width="55" height="45" rx="4" fill="#faf5ff" stroke="#a855f7" stroke-width="1"/>
    <text x="547" y="16" text-anchor="middle" font-size="10" font-weight="bold" fill="#7e22ce">TLEN</text>
    <text x="547" y="35" text-anchor="middle" font-size="9" fill="#475569">Insert</text>

    <rect filter="url(#shadow)" x="580" y="0" width="45" height="45" rx="4" fill="#fefce8" stroke="#eab308" stroke-width="1"/>
    <text x="602" y="16" text-anchor="middle" font-size="10" font-weight="bold" fill="#a16207">SEQ</text>
    <text x="602" y="35" text-anchor="middle" font-size="9" fill="#475569">Sequence</text>

    <rect filter="url(#shadow)" x="630" y="0" width="45" height="45" rx="4" fill="#fefce8" stroke="#eab308" stroke-width="1"/>
    <text x="652" y="16" text-anchor="middle" font-size="10" font-weight="bold" fill="#a16207">QUAL</text>
    <text x="652" y="35" text-anchor="middle" font-size="9" fill="#475569">Quality</text>

    <rect filter="url(#shadow)" x="678" y="0" width="30" height="45" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="693" y="16" text-anchor="middle" font-size="10" font-weight="bold" fill="#475569">TAG</text>
    <text x="693" y="35" text-anchor="middle" font-size="9" fill="#475569">Opt.</text>
  </g>

  <!-- Size comparison bar -->
  <rect filter="url(#shadow)" x="20" y="170" width="680" height="60" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="360" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">File Size Comparison (100M reads, 2×150 bp)</text>

  <rect filter="url(#shadow)" x="40" y="205" width="280" height="18" rx="3" fill="#dc2626"/>
  <text x="180" y="218" text-anchor="middle" font-size="10" font-weight="bold" fill="white">SAM: 75 GB</text>
  <rect filter="url(#shadow)" x="330" y="205" width="160" height="18" rx="3" fill="#3b82f6"/>
  <text x="410" y="218" text-anchor="middle" font-size="10" font-weight="bold" fill="white">FASTQ.gz: 45 GB</text>
  <rect filter="url(#shadow)" x="500" y="205" width="60" height="18" rx="3" fill="#f59e0b"/>
  <text x="530" y="218" text-anchor="middle" font-size="10" font-weight="bold" fill="white">BAM: 15 GB</text>
  <rect filter="url(#shadow)" x="570" y="205" width="40" height="18" rx="3" fill="#22c55e"/>
  <text x="590" y="218" text-anchor="middle" font-size="10" font-weight="bold" fill="white">CRAM: 9 GB</text>

  <!-- The big picture -->
  <rect filter="url(#shadow)" x="20" y="245" width="680" height="155" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="360" y="265" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">SAM → BAM → CRAM Conversion Flow</text>

  <!-- Conversion arrows -->
  <rect filter="url(#shadow)" x="40" y="280" width="80" height="35" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="80" y="303" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">SAM (.sam)</text>

  <path d="M125,297 C135,297 145,297 155,297" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrowGrey)"/>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="140" y="290" text-anchor="middle" font-size="9" fill="#64748b">-b</text>

  <rect filter="url(#shadow)" x="160" y="280" width="80" height="35" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="200" y="303" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">BAM (.bam)</text>

  <path d="M245,297 C255,297 265,297 275,297" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrowGrey)"/>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="260" y="290" text-anchor="middle" font-size="9" fill="#64748b">-C</text>

  <rect filter="url(#shadow)" x="280" y="280" width="80" height="35" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="320" y="303" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">CRAM (.cram)</text>

  <text x="200" y="354" text-anchor="middle" font-size="11" fill="#64748b">Use SAM for debugging</text>
  <text x="200" y="370" text-anchor="middle" font-size="11" fill="#64748b">Use BAM for active analysis</text>
  <text x="200" y="386" text-anchor="middle" font-size="11" fill="#64748b">Use CRAM for archiving / cloud</text>

  <!-- Commands -->
  <rect filter="url(#shadow)" x="420" y="278" width="300" height="115" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="570" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">Key Commands</text>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="430" y="318" font-size="10" fill="#475569">samtools view -S -b in.sam > out.bam</text>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="430" y="338" font-size="10" fill="#475569">samtools view -C -T ref.fa in.bam > out.cram</text>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="430" y="358" font-size="10" fill="#475569">samtools sort -o sorted.bam unsorted.bam</text>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="430" y="378" font-size="10" fill="#475569">samtools index sorted.bam</text>
</svg>