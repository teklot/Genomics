<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14">
  <title>DNA Double Helix with Base Pairing</title>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="1" dy="1" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Standard Markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#3b82f6"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#22c55e"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#dc2626"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#94a3b8"/>
    </marker>

    <linearGradient id="strand1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="strand2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">DNA Double Helix</text>

  <!-- Strand 1 (blue) - sinusoidal path -->
  <path d="M100,60 C120,60 140,90 160,90 C180,90 200,60 220,60 C240,60 260,90 280,90 C300,90 320,60 340,60 C360,60 380,90 400,90 C420,90 440,60 460,60 C480,60 500,90 520,90" fill="none" stroke="url(#strand1)" stroke-width="4" stroke-linecap="round"/>

  <!-- Strand 2 (red) - sinusoidal path offset -->
  <path d="M100,90 C120,90 140,60 160,60 C180,60 200,90 220,90 C240,90 260,60 280,60 C300,60 320,90 340,90 C360,90 380,60 400,60 C420,60 440,90 460,90 C480,90 500,60 520,60" fill="none" stroke="url(#strand2)" stroke-width="4" stroke-linecap="round"/>

  <!-- Base pair lines (horizontal connections) -->
  <!-- A=T -->
  <path d="M150,67 L150,83" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,2"/>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="150" y="55" text-anchor="middle" fill="#2563eb" font-weight="bold" font-size="12">A</text>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="150" y="105" text-anchor="middle" fill="#dc2626" font-weight="bold" font-size="12">T</text>

  <!-- T=A -->
  <path d="M190,83 L190,67" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,2"/>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="190" y="105" text-anchor="middle" fill="#dc2626" font-weight="bold" font-size="12">T</text>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="190" y="55" text-anchor="middle" fill="#2563eb" font-weight="bold" font-size="12">A</text>

  <!-- G≡C -->
  <path d="M230,67 L230,83" stroke="#94a3b8" stroke-width="3"/>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="230" y="55" text-anchor="middle" fill="#2563eb" font-weight="bold" font-size="12">G</text>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="230" y="105" text-anchor="middle" fill="#dc2626" font-weight="bold" font-size="12">C</text>

  <!-- C≡G -->
  <path d="M270,83 L270,67" stroke="#94a3b8" stroke-width="3"/>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="270" y="105" text-anchor="middle" fill="#dc2626" font-weight="bold" font-size="12">C</text>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="270" y="55" text-anchor="middle" fill="#2563eb" font-weight="bold" font-size="12">G</text>

  <!-- T=A -->
  <path d="M310,67 L310,83" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,2"/>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="310" y="55" text-anchor="middle" fill="#2563eb" font-weight="bold" font-size="12">T</text>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="310" y="105" text-anchor="middle" fill="#dc2626" font-weight="bold" font-size="12">A</text>

  <!-- A=T -->
  <path d="M350,83 L350,67" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,2"/>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="350" y="105" text-anchor="middle" fill="#dc2626" font-weight="bold" font-size="12">A</text>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="350" y="55" text-anchor="middle" fill="#2563eb" font-weight="bold" font-size="12">T</text>

  <!-- C≡G -->
  <path d="M390,67 L390,83" stroke="#94a3b8" stroke-width="3"/>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="390" y="55" text-anchor="middle" fill="#2563eb" font-weight="bold" font-size="12">C</text>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="390" y="105" text-anchor="middle" fill="#dc2626" font-weight="bold" font-size="12">G</text>

  <!-- G≡C -->
  <path d="M430,83 L430,67" stroke="#94a3b8" stroke-width="3"/>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="430" y="105" text-anchor="middle" fill="#dc2626" font-weight="bold" font-size="12">G</text>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="430" y="55" text-anchor="middle" fill="#2563eb" font-weight="bold" font-size="12">C</text>

  <!-- 5'/3' Labels -->
  <text x="70" y="63" text-anchor="middle" fill="#2563eb" font-weight="bold" font-size="12">5'</text>
  <text x="550" y="63" text-anchor="middle" fill="#2563eb" font-weight="bold" font-size="12">3'</text>
  <text x="70" y="93" text-anchor="middle" fill="#dc2626" font-weight="bold" font-size="12">3'</text>
  <text x="550" y="93" text-anchor="middle" fill="#dc2626" font-weight="bold" font-size="12">5'</text>

  <!-- Legend box -->
  <rect filter="url(#shadow)" x="420" y="115" width="160" height="100" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="500" y="135" text-anchor="middle" font-weight="bold" font-size="13" fill="#1e293b">Pairing Rules</text>
  <path d="M435,150 L460,150" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="465" y="154" font-size="12" fill="#475569">A ⇔ T (2 bonds)</text>
  <path d="M435,170 L460,170" stroke="#94a3b8" stroke-width="3"/>
  <text x="465" y="174" font-size="12" fill="#475569">C ⇔ G (3 bonds)</text>
  <path d="M435,190 L445,190" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <text x="450" y="194" font-size="11" fill="#2563eb">Strand 1 (5'→3')</text>
  <path d="M435,205 L445,205" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  <text x="450" y="209" font-size="11" fill="#dc2626">Strand 2 (3'→5')</text>

  <!-- Background sugar-phosphate backbone labels -->
  <text x="300" y="280" text-anchor="middle" font-size="13" fill="#64748b" font-style="italic">5' — Sugar–Phosphate Backbone — 3'</text>
  <text x="300" y="300" text-anchor="middle" font-size="12" fill="#94a3b8">Bases project inward, forming hydrogen bonds</text>

  <!-- Complementary principle box -->
  <rect filter="url(#shadow)" x="100" y="330" width="400" height="50" rx="6" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="300" y="350" text-anchor="middle" font-size="13" fill="#0369a1" font-weight="bold">Complementary Base Pairing</text>
  <text x="300" y="368" text-anchor="middle" font-size="12" fill="#0c4a6e">Each strand is a full backup of the other's information</text>

  <!-- Bottom labels -->
  <text x="300" y="410" text-anchor="middle" font-size="13" fill="#64748b">Software Analogy:</text>
  <text x="300" y="430" text-anchor="middle" font-size="13" fill="#2563eb" font-weight="bold"> Two synchronized servers in different data centers</text>
</svg>