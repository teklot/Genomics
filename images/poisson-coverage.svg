<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="1" dy="1" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Standard Markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#3b82f6"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#22c55e"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#dc2626"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#94a3b8"/>
    </marker>
  </defs>
  <title>Poisson Distribution of Coverage</title>

  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Coverage Distribution Across the Genome (Poisson)</text>

  <!-- Chart area -->
  <rect x="60" y="50" width="500" height="200" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Y-axis -->
  <path d="M80,50 L80,240" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M80,240 L560,240" stroke="#64748b" stroke-width="2" fill="none"/>

  <!-- Y-axis labels -->
  <text font-family="Consolas, 'Liberation Mono', monospace" x="70" y="244" text-anchor="end" font-size="10" fill="#64748b">0</text>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="70" y="144" text-anchor="end" font-size="10" fill="#64748b">0.10</text>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="70" y="59" text-anchor="end" font-size="10" fill="#64748b">0.20</text>
  <text x="15" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#64748b" transform="rotate(-90,15,150)">Probability</text>

  <!-- X-axis labels -->
  <text x="300" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="#64748b">Coverage Depth (Number of Reads)</text>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="100" y="258" text-anchor="middle" font-size="10" fill="#64748b">0</text>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="180" y="258" text-anchor="middle" font-size="10" fill="#64748b">10</text>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="260" y="258" text-anchor="middle" font-size="10" fill="#64748b">20</text>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="340" y="258" text-anchor="middle" font-size="10" fill="#64748b">30</text>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="420" y="258" text-anchor="middle" font-size="10" fill="#64748b">40</text>
  <text font-family="Consolas, 'Liberation Mono', monospace" x="500" y="258" text-anchor="middle" font-size="10" fill="#64748b">50</text>

  <!-- Poisson curves -->
  <!-- 5x Curve: peaks at k=5 (x=140, y=82) -->
  <path d="M100,234 C110,210 125,120 140,82 C155,82 170,150 180,200 C190,225 195,234 200,237 C205,240 210,240 220,240" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5,3"/>
  <!-- 15x Curve: peaks at k=15 (x=220, y=150) -->
  <path d="M120,240 C140,240 160,230 180,200 C200,170 210,150 220,150 C230,150 240,170 260,200 C280,230 290,235 300,238 C310,240 320,240 340,240" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
  <!-- 30x Curve: peaks at k=30 (x=340, y=174) -->
  <path d="M220,240 C240,240 260,238 290,220 C320,200 330,174 340,174 C350,174 360,200 390,220 C420,238 440,240 460,240" fill="none" stroke="#22c55e" stroke-width="2.5"/>

  <!-- Legend -->
  <rect filter="url(#shadow)" x="350" y="55" width="200" height="75" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M360,70 L390,70" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5,3" fill="none"/>
  <text x="400" y="74" font-size="11" font-weight="bold" fill="#475569">5× (low-pass)</text>
  <path d="M360,90 L390,90" stroke="#3b82f6" stroke-width="2.5" fill="none"/>
  <text x="400" y="94" font-size="11" font-weight="bold" fill="#475569">15× (exome)</text>
  <path d="M360,110 L390,110" stroke="#22c55e" stroke-width="2.5" fill="none"/>
  <text x="400" y="114" font-size="11" font-weight="bold" fill="#475569">30× (WGS standard)</text>

  <!-- Key insight -->
  <text x="300" y="305" text-anchor="middle" font-size="11" fill="#64748b">At 30× coverage: &lt;0.01% of genome has &lt;10× coverage; 99.9% confidence for SNV detection</text>
</svg>