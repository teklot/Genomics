<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13">
  <title>Gene Structure: Promoter, Exons, Introns</title>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="1" dy="1" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Standard Markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#3b82f6"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#22c55e"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#dc2626"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Gene Structure</text>

  <!-- Direction of transcription -->
  <path d="M40,60 L660,60" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrowGrey)"/>
  <text x="350" y="55" text-anchor="middle" font-size="11" fill="#64748b">Direction of transcription (5' → 3')</text>

  <!-- Promoter -->
  <rect filter="url(#shadow)" x="40" y="80" width="80" height="40" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="80" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">Promoter</text>

  <!-- 5' UTR -->
  <rect filter="url(#shadow)" x="125" y="80" width="40" height="40" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="145" y="105" text-anchor="middle" font-size="10" fill="#4338ca">5' UTR</text>

  <!-- Exon 1 -->
  <rect filter="url(#shadow)" x="170" y="70" width="70" height="60" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2.5"/>
  <text x="205" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">Exon 1</text>
  <text x="205" y="116" text-anchor="middle" font-size="10" fill="#166534">Coding</text>

  <!-- Intron 1 -->
  <rect filter="url(#shadow)" x="245" y="80" width="70" height="40" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="280" y="105" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">Intron 1</text>

  <!-- Exon 2 -->
  <rect filter="url(#shadow)" x="320" y="70" width="70" height="60" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2.5"/>
  <text x="355" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">Exon 2</text>
  <text x="355" y="116" text-anchor="middle" font-size="10" fill="#166534">Coding</text>

  <!-- Intron 2 -->
  <rect filter="url(#shadow)" x="395" y="80" width="70" height="40" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="430" y="105" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">Intron 2</text>

  <!-- Exon 3 -->
  <rect filter="url(#shadow)" x="470" y="70" width="70" height="60" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2.5"/>
  <text x="505" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">Exon 3</text>
  <text x="505" y="116" text-anchor="middle" font-size="10" fill="#166534">Coding</text>

  <!-- 3' UTR -->
  <rect filter="url(#shadow)" x="545" y="80" width="40" height="40" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="565" y="105" text-anchor="middle" font-size="10" fill="#4338ca">3' UTR</text>

  <!-- Terminator -->
  <rect filter="url(#shadow)" x="590" y="80" width="70" height="40" rx="4" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
  <text x="625" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#be185d">Term.</text>

  <!-- DNA backbone line -->
  <path d="M40,155 L660,155" stroke="#334155" stroke-width="3" fill="none"/>
  <path d="M40,162 L660,162" stroke="#64748b" stroke-width="2" fill="none"/>
  <text x="350" y="178" text-anchor="middle" font-size="11" fill="#64748b">DNA Double Strand</text>

  <!-- After splicing panel -->
  <rect filter="url(#shadow)" x="100" y="200" width="500" height="70" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="350" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">After Splicing (Mature mRNA)</text>
  <text x="350" y="240" text-anchor="middle" font-size="12" fill="#475569">[5' UTR] — [Exon 1] — [Exon 2] — [Exon 3] — [3' UTR]</text>
  <text x="350" y="258" text-anchor="middle" font-size="11" fill="#64748b">Introns removed. 5' cap and poly-A tail added.</text>

  <!-- Legend -->
  <rect x="40" y="285" width="620" height="55" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="305" font-size="12" font-weight="bold" fill="#334155">Legend:</text>
  <rect filter="url(#shadow)" x="120" y="295" width="50" height="15" rx="3" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="175" y="307" font-size="11" fill="#475569">Exon (coding)</text>
  <rect filter="url(#shadow)" x="280" y="295" width="50" height="15" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="335" y="307" font-size="11" fill="#475569">Intron (removed)</text>
  <rect filter="url(#shadow)" x="440" y="295" width="50" height="15" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="495" y="307" font-size="11" fill="#475569">Regulatory</text>
  <text x="350" y="327" text-anchor="middle" font-size="11" fill="#64748b">SWE Analogy: Gene = Source File, Exons = Included Modules, Introns = Comments/Debug Code</text>
</svg>