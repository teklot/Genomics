<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="1" dy="1" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Standard Markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#3b82f6"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#22c55e"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#dc2626"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Chromosome Anatomy</text>

  <!-- Main chromosome shape -->
  <g stroke-width="8" stroke-linecap="round" fill="none">
    <!-- Left chromatid p-arm (blue) -->
    <path d="M250,70 C250,70 230,110 230,150 L230,185 C230,205 250,215 270,215 C290,215 290,205 290,185 L290,150 C290,110 270,95 270,70 C270,50 250,40 230,40 C210,40 200,50 200,70 L200,100" stroke="#3b82f6"/>
    <!-- Right chromatid p-arm (blue) -->
    <path d="M350,70 C350,70 370,110 370,150 L370,185 C370,205 350,215 330,215 C310,215 310,205 310,185 L310,150 C310,110 330,95 330,70 C330,50 350,40 370,40 C390,40 400,50 400,70 L400,100" stroke="#3b82f6"/>
    <!-- Left chromatid q-arm (purple) -->
    <path d="M270,215 C290,215 290,225 290,245 L290,280 C290,320 270,335 270,360 C270,380 250,390 230,390 C210,390 200,380 200,360 L200,330 L200,280 C200,240 230,220 250,215" stroke="#7e22ce"/>
    <!-- Right chromatid q-arm (purple) -->
    <path d="M330,215 C310,215 310,225 310,245 L310,280 C310,320 330,335 330,360 C330,380 350,390 370,390 C390,390 400,380 400,360 L400,330 L400,280 C400,240 370,220 350,215" stroke="#7e22ce"/>
  </g>

  <!-- Centromere -->
  <ellipse filter="url(#shadow)" cx="300" cy="215" rx="65" ry="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
  <text x="300" y="219" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">Centromere</text>

  <!-- Arm Labels (Moved out of the paths) -->
  <g text-anchor="middle" font-size="14" font-weight="bold">
    <text x="160" y="110" fill="#1d4ed8">p arm</text>
    <text x="440" y="110" fill="#1d4ed8">p arm</text>
    <text x="160" y="320" fill="#7e22ce">q arm</text>
    <text x="440" y="320" fill="#7e22ce">q arm</text>
    <text x="300" y="100" font-size="12" fill="#64748b">(Short)</text>
    <text x="300" y="330" font-size="12" fill="#64748b">(Long)</text>
  </g>

  <!-- Telomere labels (Top) -->
  <g transform="translate(-15, 0)">
    <rect filter="url(#shadow)" x="215" y="40" width="35" height="18" rx="4" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
    <text x="232" y="53" text-anchor="middle" font-size="10" font-weight="bold" fill="#be185d">Tel</text>
  </g>
  <g transform="translate(15, 0)">
    <rect filter="url(#shadow)" x="350" y="40" width="35" height="18" rx="4" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
    <text x="367" y="53" text-anchor="middle" font-size="10" font-weight="bold" fill="#be185d">Tel</text>
  </g>

  <!-- Telomere labels (Bottom) -->
  <g transform="translate(-15, 0)">
    <rect filter="url(#shadow)" x="215" y="372" width="35" height="18" rx="4" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
    <text x="232" y="385" text-anchor="middle" font-size="10" font-weight="bold" fill="#be185d">Tel</text>
  </g>
  <g transform="translate(15, 0)">
    <rect filter="url(#shadow)" x="350" y="372" width="35" height="18" rx="4" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
    <text x="367" y="385" text-anchor="middle" font-size="10" font-weight="bold" fill="#be185d">Tel</text>
  </g>
  
  <!-- p arm callout -->
  <rect filter="url(#shadow)" x="440" y="130" width="140" height="45" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="510" y="150" text-anchor="middle" font-size="10" fill="#475569">"p" is for "petit" (small)</text>
  <path d="M400,110 C420,110 430,130 440,140" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,2" fill="none" marker-end="url(#arrowGrey)"/>

  <!-- q arm callout -->
  <rect filter="url(#shadow)" x="20" y="240" width="140" height="45" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="90" y="260" text-anchor="middle" font-size="10" fill="#475569">"q" follows "p" in alpha</text>
  <path d="M200,280 C180,280 170,270 160,265" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,2" fill="none" marker-end="url(#arrowGrey)"/>

  <!-- Info panel -->
  <rect x="20" y="380" width="560" height="30" rx="6" fill="#f1f5f9"/>
  <text x="300" y="399" text-anchor="middle" font-size="11" fill="#64748b">Humans have 23 pairs of chromosomes — sister chromatids join at the centromere.</text>

</svg>