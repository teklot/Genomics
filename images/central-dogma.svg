<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13">
  <title>Central Dogma: DNA → RNA → Protein</title>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="1" dy="1" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="nucleus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="cytoplasm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    
    <!-- Standard Markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#3b82f6"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#22c55e"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#dc2626"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="650" rx="8" fill="#f8fafc"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">The Central Dogma of Molecular Biology</text>

  <!-- Regions -->
  <rect filter="url(#shadow)" x="30" y="70" width="540" height="260" rx="12" fill="url(#nucleus)" stroke="#93c5fd" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="50" y="95" font-size="14" font-weight="bold" fill="#1d4ed8">NUCLEUS (Storage &amp; Transcription)</text>

  <rect filter="url(#shadow)" x="30" y="350" width="540" height="230" rx="12" fill="url(#cytoplasm)" stroke="#d8b4fe" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="50" y="375" font-size="14" font-weight="bold" fill="#7e22ce">CYTOPLASM (Translation)</text>

  <!-- DNA box -->
  <rect filter="url(#shadow)" x="60" y="115" width="160" height="100" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="140" y="145" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">DNA</text>
  <text x="140" y="165" text-anchor="middle" font-size="11" fill="#475569">Double-stranded</text>
  <text x="140" y="180" text-anchor="middle" font-size="11" fill="#475569">Permanent storage</text>
  <text x="140" y="195" text-anchor="middle" font-size="11" fill="#475569" font-style="italic">"Source Code"</text>

  <!-- pre-mRNA box -->
  <rect filter="url(#shadow)" x="360" y="115" width="160" height="100" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="440" y="145" text-anchor="middle" font-size="16" font-weight="bold" fill="#b45309">pre-mRNA</text>
  <text x="440" y="165" text-anchor="middle" font-size="11" fill="#475569">Primary transcript</text>
  <text x="440" y="180" text-anchor="middle" font-size="11" fill="#475569">Unprocessed</text>
  <text x="440" y="195" text-anchor="middle" font-size="11" fill="#475569" font-style="italic">"Build w/ comments"</text>

  <!-- mRNA box -->
  <rect filter="url(#shadow)" x="360" y="390" width="160" height="100" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="440" y="420" text-anchor="middle" font-size="16" font-weight="bold" fill="#b45309">mRNA</text>
  <text x="440" y="440" text-anchor="middle" font-size="11" fill="#475569">Spliced, capped</text>
  <text x="440" y="455" text-anchor="middle" font-size="11" fill="#475569">Exported to cytosol</text>
  <text x="440" y="470" text-anchor="middle" font-size="11" fill="#475569" font-style="italic">"Optimized Bytecode"</text>

  <!-- Protein box -->
  <rect filter="url(#shadow)" x="60" y="390" width="160" height="100" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="140" y="420" text-anchor="middle" font-size="16" font-weight="bold" fill="#15803d">Protein</text>
  <text x="140" y="440" text-anchor="middle" font-size="11" fill="#475569">Folded polypeptide</text>
  <text x="140" y="455" text-anchor="middle" font-size="11" fill="#475569">Functional unit</text>
  <text x="140" y="470" text-anchor="middle" font-size="11" fill="#475569" font-style="italic">"Executable App"</text>

  <!-- Arrow DNA → pre-mRNA (curved) -->
  <path d="M220,165 C290,165 290,165 350,165" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="290" y="150" text-anchor="middle" font-size="12" fill="#2563eb" font-weight="bold">TRANSCRIPTION</text>
  <text x="290" y="180" text-anchor="middle" font-size="10" fill="#64748b">RNA Polymerase</text>

  <!-- Arrow pre-mRNA → mRNA (curved) -->
  <path d="M440,215 C440,297.5 440,297.5 440,380" stroke="#f59e0b" stroke-width="3" fill="none" marker-end="url(#arrowAmber)"/>
  <text x="455" y="290" text-anchor="start" font-size="12" fill="#b45309" font-weight="bold">SPLICING</text>
  <text x="455" y="305" text-anchor="start" font-size="10" fill="#64748b">+ Nuclear Export</text>

  <!-- Arrow mRNA → Protein (curved) -->
  <path d="M360,440 C295,440 295,440 230,440" stroke="#22c55e" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="295" y="430" text-anchor="middle" font-size="12" fill="#16a34a" font-weight="bold">TRANSLATION</text>
  <text x="295" y="460" text-anchor="middle" font-size="10" fill="#64748b">Ribosome + tRNA</text>

  <!-- SWE Analogy panel -->
  <rect x="600" y="70" width="170" height="510" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="685" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">SWE ANALOGY</text>
  <path d="M615,105 L755,105" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Analogy items with fixed spacing -->
  <g transform="translate(615, 120)">
    <rect filter="url(#shadow)" x="0" y="0" width="140" height="60" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
    <text x="70" y="25" text-anchor="middle" font-size="12" fill="#1d4ed8" font-weight="bold">Source Code</text>
    <text font-family="Consolas, 'Liberation Mono', monospace" x="70" y="45" text-anchor="middle" font-size="10" fill="#64748b">On-disk storage</text>

    <path d="M70,65 C70,80 70,80 70,95" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
    <text x="80" y="85" font-size="10" fill="#64748b" font-weight="bold">Compile</text>

    <rect filter="url(#shadow)" x="0" y="105" width="140" height="60" rx="4" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
    <text x="70" y="130" text-anchor="middle" font-size="12" fill="#b45309" font-weight="bold">AST + Comments</text>
    <text font-family="Consolas, 'Liberation Mono', monospace" x="70" y="150" text-anchor="middle" font-size="10" fill="#64748b">Intermediate state</text>

    <path d="M70,170 C70,185 70,185 70,200" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrowAmber)"/>
    <text x="80" y="190" font-size="10" fill="#64748b" font-weight="bold">Optimize</text>

    <rect filter="url(#shadow)" x="0" y="210" width="140" height="60" rx="4" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
    <text x="70" y="235" text-anchor="middle" font-size="12" fill="#b45309" font-weight="bold">Optimized IR</text>
    <text font-family="Consolas, 'Liberation Mono', monospace" x="70" y="255" text-anchor="middle" font-size="10" fill="#64748b">Bytecode</text>

    <path d="M70,275 C70,290 70,290 70,305" stroke="#22c55e" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
    <text x="80" y="295" font-size="10" fill="#64748b" font-weight="bold">Link/Run</text>

    <rect filter="url(#shadow)" x="0" y="315" width="140" height="60" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
    <text x="70" y="340" text-anchor="middle" font-size="12" fill="#15803d" font-weight="bold">Binary / Exe</text>
    <text font-family="Consolas, 'Liberation Mono', monospace" x="70" y="360" text-anchor="middle" font-size="10" fill="#64748b">Running process</text>
  </g>

  <!-- Footer -->
  <rect x="30" y="605" width="740" height="30" rx="4" fill="#f1f5f9"/>
  <text x="400" y="625" text-anchor="middle" font-size="12" fill="#64748b" font-weight="bold">Information flows one way: DNA → RNA → Protein (Crick's original thesis)</text>
</svg>